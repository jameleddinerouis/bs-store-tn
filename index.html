<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS STORE TN | Accueil</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bs-blue: #0A56D9; --bs-yellow: #FFD000; --bs-red: #E63946; --bs-dark: #121212; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Lilita One', cursive;
            background: radial-gradient(circle at center, #1a65e0, #0a3da1);
            color: var(--white);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        .marquee-container {
            background: var(--bs-red);
            padding: 12px 0;
            border-bottom: 5px solid var(--bs-dark);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            white-space: nowrap;
            overflow: hidden;
        }
        .marquee-text { display: inline-block; animation: scroll 20s linear infinite; font-size: 1.2rem; text-transform: uppercase; }
        @keyframes scroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 6px solid var(--bs-dark);
        }
        .logo-text { font-size: 4rem; color: var(--bs-yellow); text-shadow: 4px 4px 0 var(--bs-dark), -2px -2px 0 var(--white); letter-spacing: 3px; }

        .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
        h1 { font-size: 5rem; text-shadow: 6px 6px 0 var(--bs-dark); margin-bottom: 10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .subtitle { font-family: 'Poppins', sans-serif; font-weight: 700; color: var(--bs-yellow); font-size: 1.5rem; margin-bottom: 40px; background: var(--bs-dark); padding: 5px 20px; border-radius: 50px; }

        .btn-group { display: flex; flex-direction: column; gap: 25px; width: 100%; max-width: 450px; }
        .btn-bs {
            text-decoration: none; padding: 25px; font-size: 2.2rem; border: 5px solid var(--bs-dark); border-radius: 18px;
            color: var(--bs-dark); text-align: center; box-shadow: 8px 10px 0 var(--bs-dark); transition: 0.1s;
        }
        .btn-bs:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--bs-dark); }
        .btn-yellow { background: var(--bs-yellow); }
        .btn-discord { background: #5865F2; color: white; }

        .reviews-bar { background: rgba(0,0,0,0.6); padding: 30px 0; border-top: 5px solid var(--bs-dark); margin-top: 50px; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="marquee-container">
        <div class="marquee-text">🚀 BRAWL PASS PLUS DISPO • 💎 GEMMES AU MEILLEUR PRIX • 🇹🇳 PAIEMENT FLOUCI / D17 • LIVRAISON ÉCLAIR ⚡</div>
    </div>

    <header>
        <div class="logo-text">BS STORE TN</div>
    </header>

    <main class="hero">
        <h1>BIENVENUE BOSS</h1>
        <div class="subtitle">LE STORE #1 EN TUNISIE 🇹🇳</div>

        <div class="btn-group">
            <a href="offres.html" class="btn-bs btn-yellow">🛒 NOS OFFRES</a>
            <a href="#" class="btn-bs btn-discord">💬 DISCORD</a>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<50; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*5+2, speedX: Math.random()*2-1, speedY: Math.random()*2-1 });
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if(p.x > canvas.width || p.x < 0) p.speedX *= -1;
                if(p.y > canvas.height || p.y < 0) p.speedY *= -1;
                ctx.fillStyle = 'rgba(255, 208, 0, 0.5)';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', init);
        init(); animate();
    </script>
</body>
</html>
