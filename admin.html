<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS Admin | Secure Access</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-panel { border: 2px solid #00ff41; padding: 40px; background: rgba(0,20,0,0.9); box-shadow: 0 0 30px rgba(0,255,65,0.2); width: 100%; max-width: 450px; }
        h2 { border-bottom: 1px solid #00ff41; padding-bottom: 10px; margin-bottom: 30px; text-align: center; }
        .input-box { width: 100%; background: black; border: 1px solid #00ff41; padding: 15px; color: #00ff41; margin-bottom: 20px; outline: none; }
        .btn-access { width: 100%; border: 1px solid #00ff41; background: transparent; color: #00ff41; padding: 15px; cursor: pointer; font-family: inherit; font-size: 1.2rem; }
        .btn-access:hover { background: #00ff41; color: black; }
        #console { font-size: 0.8rem; margin-top: 20px; min-height: 60px; }
    </style>
</head>
<body>
    <div class="admin-panel">
        <h2>[ SECURE_LOGIN ]</h2>
        <input type="text" class="input-box" placeholder="ADMIN_USER">
        <input type="password" class="input-box" placeholder="SECURITY_KEY">
        <button class="btn-access" onclick="access()">INITIALISER_ACCÈS</button>
        <div id="console"></div>
    </div>

    <script>
        const consoleDiv = document.getElementById('console');
        const logs = [
            "> Connexion serveur tunisien établie...",
            "> Scan des ports de sécurité...",
            "> Accès BS-STORE-DATABASE [READY]",
            "> En attente d'authentification..."
        ];
        let i = 0;
        function typeLog() {
            if(i < logs.length) {
                consoleDiv.innerHTML += logs[i] + "<br>";
                i++;
                setTimeout(typeLog, 800);
            }
        }
        window.onload = typeLog;
        function access() { alert("Accès refusé : Clé de cryptage manquante."); }
    </script>
</body>
</html>
